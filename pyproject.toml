[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keylayoutfixer"
dynamic = ["version"]
description = "Cross-platform Persian/English keyboard layout converter — terminal tool and tray app"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "erffanhub-00" }]
keywords = ["persian", "farsi", "keyboard-layout", "converter", "clipboard", "tray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
tray = [
    "pystray>=0.19",
    "pynput>=1.7",
    "pyperclip>=1.8",
    "Pillow>=10",
]
dev = [
    "pytest>=8",
]

[project.scripts]
klf = "keylayoutfixer.cli:main"
keylayoutfixer = "keylayoutfixer.cli:main"

[project.urls]
Homepage = "https://github.com/erffanhub-00/KeyLayoutFixer-Ultimate"
Source = "https://github.com/erffanhub-00/KeyLayoutFixer-Ultimate"

[tool.setuptools.dynamic]
version = { attr = "keylayoutfixer.__version__" }

[tool.setuptools.packages.find]
include = ["keylayoutfixer*"]
